      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(290)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(300)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(310)"/>
