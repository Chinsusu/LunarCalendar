    </g>
    <g transform="translate(200,200) rotate(337)">
      <path d="M148,-5 Q153,-9 158,-5 Q153,-1 148,-5 Z"/>
    </g>
  </g>

  <!-- Geometric band between r=95 and r=110 -->
  <g fill="#8B1A1A" fill-opacity="0.35">
    <g transform="translate(200,200)">
      <!-- 24 small triangles around circle at r=102 -->
      <path d="M0,-102 L4,-92 L-4,-92 Z"/>
