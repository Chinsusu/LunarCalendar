<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Outer decorative rings -->
  <circle cx="200" cy="200" r="195" stroke="#8B1A1A" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="200" cy="200" r="185" stroke="#8B1A1A" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="175" stroke="#8B1A1A" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Center sun / star motif (ngôi sao Đông Sơn 12 cánh) -->
  <g transform="translate(200,200)">
    <!-- 12-pointed star -->
    <path
      d="M0,-52 L7,-22 L28,-38 L16,-10 L42,0 L16,10 L28,38 L7,22 L0,52 L-7,22 L-28,38 L-16,10 L-42,0 L-16,-10 L-28,-38 L-7,-22 Z"
      fill="#8B1A1A" fill-opacity="0.5"
    />
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="16" fill="#8B1A1A" fill-opacity="0.4"/>
    <circle cx="0" cy="0" r="10" stroke="#8B1A1A" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>
    <circle cx="0" cy="0" r="5" fill="#8B1A1A" fill-opacity="0.6"/>
  </g>

  <!-- Concentric decorative rings with notches -->
  <circle cx="200" cy="200" r="68" stroke="#8B1A1A" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <circle cx="200" cy="200" r="80" stroke="#8B1A1A" stroke-width="1" stroke-opacity="0.3" fill="none" stroke-dasharray="4 3"/>
  <circle cx="200" cy="200" r="95" stroke="#8B1A1A" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- Band of flying birds (heron/egret motifs Đông Sơn) - simplified -->
  <g stroke="#8B1A1A" stroke-width="1.2" stroke-opacity="0.5" fill="none">
    <!-- 8 birds evenly spaced around r=120 -->
    <g transform="translate(200,200) rotate(0)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(45)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(90)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(135)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(180)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(225)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(270)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
    <g transform="translate(200,200) rotate(315)">
      <path d="M120,-6 Q126,-10 132,-6 Q126,-2 120,-6 Z M122,-4 L130,-4"/>
    </g>
  </g>

  <!-- Outer bird ring at r=148 -->
  <g stroke="#8B1A1A" stroke-width="1" stroke-opacity="0.4" fill="none">
    <g transform="translate(200,200) rotate(22)">
      <path d="M148,-5 Q153,-9 158,-5 Q153,-1 148,-5 Z"/>
    </g>
    <g transform="translate(200,200) rotate(67)">
      <path d="M148,-5 Q153,-9 158,-5 Q153,-1 148,-5 Z"/>
    </g>
    <g transform="translate(200,200) rotate(112)">
      <path d="M148,-5 Q153,-9 158,-5 Q153,-1 148,-5 Z"/>
    </g>
    <g transform="translate(200,200) rotate(157)">
