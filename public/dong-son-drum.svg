      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(160)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(170)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(180)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(190)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(200)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(210)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(220)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(230)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(240)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(250)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(260)"/>
