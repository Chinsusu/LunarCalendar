      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(75)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(90)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(105)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(120)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(135)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(150)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(165)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(180)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(195)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(210)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(225)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(240)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(255)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(270)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(285)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(300)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(315)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(330)"/>
      <path d="M0,-102 L4,-92 L-4,-92 Z" transform="rotate(345)"/>
    </g>
  </g>

  <!-- Inner dotted ring -->
  <circle cx="200" cy="200" r="56" stroke="#8B1A1A" stroke-width="1" stroke-opacity="0.35" fill="none" stroke-dasharray="2 4"/>

