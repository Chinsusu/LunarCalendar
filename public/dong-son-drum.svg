      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(10)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(20)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(30)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(40)"/>
      <path d="M0,-165 L3,-158 L-3,-158 Z" transform="rotate(50)"/>
